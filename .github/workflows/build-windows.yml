name: Build LUNA IA

on:
  push:
    branches: [main, luna-v2-zero]
    paths:
      - 'agent/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build agent/LunaPC.csproj -c Release
      - name: Publish self-contained Windows app
        run: dotnet publish agent/LunaPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package
        run: Compress-Archive -Path publish/LunaIA.exe -DestinationPath LunaIA-win-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaIA-win-x64
          path: LunaIA-win-x64.zip
